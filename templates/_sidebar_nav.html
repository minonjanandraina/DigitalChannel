<div class="sidebar-section-title">Services</div>

   href="{% if user.peut_importer_csv_mvola %}{% url 'transactions:mvola_import' %}{% elif user.peut_lancer_rapprochement %}{% url 'transactions:mvola_rapprochement' %}{% else %}{% url 'transactions:mvola_liste_transactions' %}{% endif %}">

<a class="sidebar-link {% if active_service == 'om' %}active{% endif %}"

</a>
<span class="sidebar-link disabled" title="Bientot disponible">

</span>

{% if user.peut_gerer_roles or user.peut_gerer_utilisateurs %}

{% if user.peut_gerer_roles %}
<a class="sidebar-link {% if active_admin_tab == 'roles' %}active{% endif %}" href="{% url 'user:roles_liste' %}">
    Roles
</a>
{% endif %}
{% if user.peut_gerer_utilisateurs %}
<a class="sidebar-link {% if active_admin_tab == 'utilisateurs' %}active{% endif %}" href="{% url 'user:utilisateurs_liste' %}">
    Utilisateurs
</a>
{% endif %}
